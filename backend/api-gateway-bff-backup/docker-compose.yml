version: '3.8'

services:
  # Kafka Broker
  kafka:
    image: apache/kafka:2.13-3.6.1
    container_name: docgo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/tmp/kafka-logs
    networks:
      - docgo-network

  # Zookeeper (Alternative to KRaft mode)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: docgo-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - docgo-network

  # Kafka UI (Optional - for monitoring)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: docgo-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - docgo-network

  # API Gateway BFF
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docgo-api-gateway
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=api-gateway-bff
      - KAFKA_GROUP_ID=api-gateway-group
      - USER_MANAGEMENT_SERVICE_URL=http://host.docker.internal:8002
      - AUTHENTICATION_SERVICE_URL=http://host.docker.internal:8001
      - JWT_SECRET=your-super-secret-jwt-key-here
      - JWT_EXPIRES_IN=24h
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - LOG_LEVEL=info
      - CORS_ORIGIN=*
    depends_on:
      - kafka
    networks:
      - docgo-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # Redis (Optional - for caching and session storage)
  redis:
    image: redis:7-alpine
    container_name: docgo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - docgo-network
    command: redis-server --appendonly yes

volumes:
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  redis-data:
    driver: local

networks:
  docgo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
