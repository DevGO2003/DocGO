# Server
server.port=8000

# MongoDB Atlas Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_ATLAS_URI:mongodb://localhost:27017/docgo_contract_service}}
spring.data.mongodb.database=${MONGODB_DATABASE:docgo_contract_service}
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.devgo2003.docgo.contract_service=DEBUG

# Swagger/SpringDoc Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.document-title=Contract Management Service API
springdoc.swagger-ui.page-title=DocGO - Contract Management Service
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.display-operation-id=false
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=1
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.supported-submit-methods=get,post,put,delete,patch
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.layout=StandaloneLayout
springdoc.swagger-ui.presets=SwaggerUIBundle.presets.apis,SwaggerUIStandalonePreset
springdoc.swagger-ui.plugins=SwaggerUIBundle.plugins.DownloadUrl
# Do not use root path for Swagger UI to avoid mapping conflicts on "/"
springdoc.swagger-ui.use-root-path=false
springdoc.swagger-ui.oauth2-redirect-url=http://localhost:8003/docs/oauth2-redirect.html
springdoc.swagger-ui.csrf-enabled=false

# External Service URLs
ai.service.url=${AI_SERVICE_URL:http://localhost:8017}
file.service.url=${FILE_SERVICE_URL:http://localhost:8012}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:50MB}
app.upload.directory=uploads

# Redis Cloud Configuration
spring.redis.enabled=true
spring.redis.host=${REDIS_CLOUD_HOST:redis}
spring.redis.port=${REDIS_CLOUD_PORT:6379}
spring.redis.password=${REDIS_CLOUD_PASSWORD:}
spring.redis.database=${REDIS_DB:0}
spring.redis.timeout=${REDIS_TIMEOUT:2000}ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Kafka
spring.kafka.enabled=false
spring.kafka.listener.missing-topics-fatal=false

# Redis Topics
app.redis.topic.contract-summary-updated=contract.summary.updated
app.redis.topic.contract-updated=contract.updated
app.redis.topic.approval-created=approval.created
app.redis.topic.version-created=version.created
app.redis.topic.comment-created=comment.created
app.redis.topic.esignature-created=esignature.created
app.redis.topic.reminder-created=reminder.created
app.redis.topic.audit-log-created=audit.log.created
