# Docker Environment Configuration for Contract Management Service

# Server
server.port=8002

# MongoDB Configuration for Docker
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://root:sapassword@mongodb:27017/docgo_contract_service?authSource=admin}
spring.data.mongodb.database=docgo_contract_service

# Logging
logging.level.org.springframework=INFO
logging.level.com.devgo2003.docgo.contract_service=DEBUG

# Swagger
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.use-root-path=false
springdoc.swagger-ui.document-title=Contract Management Service API
springdoc.swagger-ui.page-title=DocGO - Contract Management Service

# Redirect configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.directory=/app/uploads

# Kafka Configuration for Docker
spring.kafka.enabled=true

# Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
