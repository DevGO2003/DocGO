# Docker Environment Configuration for Contract Management Service

# Server
server.port=8002

# MongoDB Configuration for Docker
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://root:sapassword@mongodb:27017/docgo_contract_service?authSource=admin}
spring.data.mongodb.database=docgo_contract_service

# Logging Configuration - Optimized for Stacktrace Reduction
logging.level.org.springframework=INFO
logging.level.com.devgo2003.docgo.contract_service=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=WARN

# Stacktrace Configuration - Limit to 3 repetitions
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.exception-conversion-word=%wEx{3}

# Error Logging Optimization
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.org.springframework.boot.autoconfigure=WARN

# Swagger
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.use-root-path=false
springdoc.swagger-ui.document-title=Contract Management Service API
springdoc.swagger-ui.page-title=DocGO - Contract Management Service

# Redirect configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.directory=/app/uploads

# Kafka Configuration for Docker
spring.kafka.enabled=true

# Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
