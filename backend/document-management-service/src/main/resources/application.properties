# Server
server.port=8000

# MongoDB Atlas Configuration (tuyệt đối không dùng local)
spring.data.mongodb.uri=${MONGODB_ATLAS_URI:mongodb+srv://root:sapassword@devgo-docgo-cluster0.hsudzga.mongodb.net}
spring.data.mongodb.database=${MONGODB_DATABASE:docgo_document}
spring.data.mongodb.auto-index-creation=true

# Logging Configuration - Optimized for Stacktrace Reduction
logging.level.org.springframework=INFO
logging.level.com.devgo2003.docgo.document_service=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=WARN

# Stacktrace Configuration - Limit to 3 repetitions
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.exception-conversion-word=%wEx{3}

# Error Logging Optimization
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.org.springframework.boot.autoconfigure=WARN

# Swagger/SpringDoc Configuration - Optimized for Performance
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.document-title=Document Management Service API
springdoc.swagger-ui.page-title=DocGO - Document Management Service
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.display-operation-id=false
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=1
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.supported-submit-methods=get,post,put,delete,patch
springdoc.swagger-ui.layout=StandaloneLayout
springdoc.swagger-ui.use-root-path=false
springdoc.swagger-ui.csrf-enabled=false

# Performance Optimizations
springdoc.cache.disabled=false
springdoc.show-actuator=false
springdoc.packages-to-scan=com.devgo2003.docgo.document_service
springdoc.paths-to-match=/api/v1/document-management-service/**


# External Service URLs
automation.service.url=${AUTOMATION_SERVICE_URL:http://localhost:8003}
file.service.url=${FILE_SERVICE_URL:http://localhost:8002}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:50MB}
app.upload.directory=uploads

# S3 Configuration (lấy từ .env, không hardcode secrets)
app.s3.bucket=${S3_BUCKET}
app.s3.endpoint=${S3_ENDPOINT}
app.s3.region=${S3_REGION}
app.s3.access-key=${S3_ACCESS_KEY}
app.s3.secret-key=${S3_SECRET_KEY}

# Redis Cloud Configuration
spring.redis.enabled=true
spring.redis.host=${REDIS_CLOUD_HOST:redis}
spring.redis.port=${REDIS_CLOUD_PORT:6379}
spring.redis.password=${REDIS_CLOUD_PASSWORD:}
spring.redis.database=${REDIS_DB:0}
spring.redis.timeout=${REDIS_TIMEOUT:2000}ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Kafka
spring.kafka.enabled=false
spring.kafka.listener.missing-topics-fatal=false

# Redis Topics
app.redis.topic.contract-summary-updated=contract.summary.updated
app.redis.topic.contract-updated=contract.updated
app.redis.topic.approval-created=approval.created
app.redis.topic.version-created=version.created
app.redis.topic.comment-created=comment.created
app.redis.topic.esignature-created=esignature.created
app.redis.topic.reminder-created=reminder.created
app.redis.topic.audit-log-created=audit.log.created

# Spring Boot DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**,resources/**
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400