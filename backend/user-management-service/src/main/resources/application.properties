spring.application.name=user-management-service
# Server
server.port=8000
server.forward-headers-strategy=framework

# MongoDB Atlas Configuration (tuyệt đối không dùng local)
spring.data.mongodb.uri=${MONGODB_ATLAS_URI:mongodb+srv://root:sapassword@devgo-docgo-cluster0.hsudzga.mongodb.net}
spring.data.mongodb.database=${MONGODB_DATABASE:docgo_user}
spring.data.mongodb.auto-index-creation=true

# Legacy MariaDB configuration removed - using MongoDB Atlas only

# Logging Configuration - Optimized for Stacktrace Reduction
logging.level.org.springframework=INFO
logging.level.com.devgo2003.docgo.auth_service=DEBUG
logging.level.com.devgo2003.docgo.backend.user_service.security=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data=WARN
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot=WARN

# Stacktrace Configuration - Limit to 3 repetitions
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.exception-conversion-word=%wEx{3}

# Error Logging Optimization
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.org.springframework.boot.autoconfigure=WARN

# Swagger/OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs

# Redirect configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# JWT Configuration (lấy từ .env)
security.jwt.base64-secret=${JWT_SECRET}
security.jwt.access-ttl-seconds=${JWT_ACCESS_EXPIRATION:3600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_EXPIRATION:2592000}

# Redis Cloud Configuration
spring.data.redis.host=${REDIS_CLOUD_HOST:localhost}
spring.data.redis.port=${REDIS_CLOUD_PORT:6379}
spring.data.redis.password=${REDIS_CLOUD_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
auth.blacklist.provider=redis # values: redis|memory

# Spring Boot DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400
spring.devtools.restart.exclude=static/**,public/**,resources/**,META-INF/maven/**,META-INF/resources/**

# OAuth2 Client (Google) - ENABLED
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8001/login/oauth2/code/google}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
