# Docker Compose Local - Simplified Architecture (5 Services + Infrastructure)
# Tên container: docgo-local
# Kiến trúc tối giản: 5 services + MongoDB + Redis + Kafka

services:
  # MongoDB Atlas - Database chính (Cloud)
  # Sử dụng MongoDB Atlas thay vì MongoDB local
  # Connection: mongodb+srv://root:sapassword@devgo-docgo-cluster0.hsudzga.mongodb.net/?retryWrites=true&w=majority&appName=devgo-docgo-cluster0

  # Redis - Cache và Message Queue
  redis:
    image: redis:7-alpine
    container_name: docgo-local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docgo_network_local

  # Kafka - Message Broker (tùy chọn, có thể bỏ nếu không cần)
  kafka:
    image: bitnami/kafka:3.7
    container_name: docgo-local-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9094
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9094,INTERNAL://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_MESSAGE_MAX_BYTES=10485760  # 10MB
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=10485760  # 10MB
      - KAFKA_CFG_MAX_REQUEST_SIZE=10485760  # 10MB
    networks:
      - docgo_network_local

  # API Gateway BFF (Next.js) - Port 8000
  api-gateway-bff:
    image: node:18-alpine
    container_name: docgo-local-api-gateway-bff
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - backend/api-gateway-bff/env/.env.local
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend/api-gateway-bff:/app
      - /app/node_modules
      - npm_cache:/root/.npm
    command: >
      sh -c "npm install --cache /root/.npm && npm run dev"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docgo_network_local

  # Frontend Web (Next.js) - Development server on port 3000
  web-nextjs:
    image: node:18-alpine
    container_name: docgo-local-web-nextjs
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - frontend/web_nextjs/env/.env.local
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      - NEXT_WEBPACK_USEPOLLING=1
      - BROWSER=none
      - FAST_REFRESH=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend/web_nextjs:/app
      - /app/node_modules
      - /app/.next
      - npm_cache:/root/.npm
    command: >
      sh -c "npm install --cache /root/.npm && npm run dev -- -p 3000 -H 0.0.0.0"
    networks:
      - docgo_network_local

  # Authentication & Identity Service (Spring Boot) - Port 8001
  authentication-identity-service:
    build:
      context: backend/authentication-identity-service
      dockerfile: Dockerfile
      target: builder
    container_name: docgo-local-authentication-identity-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8001:8000"
    env_file:
      - backend/authentication-identity-service/env/.env.local
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - ./backend/authentication-identity-service:/app
      - maven_cache:/root/.m2
    command: >
      sh -c "chmod +x ./mvnw && ./mvnw -DskipTests clean spring-boot:run -Dspring-boot.run.jvmArguments='-Dserver.port=8000'"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docgo_network_local

  # Contract Management Service (Spring Boot) - Port 8002
  contract-management-service:
    build:
      context: backend/contract-management-service
      dockerfile: Dockerfile
      target: builder
    container_name: docgo-local-contract-management-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8002:8000"
    env_file:
      - backend/contract-management-service/env/.env.local
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MAVEN_OPTS=-Xmx2g -XX:+UseG1GC -XX:+UseStringDeduplication
    volumes:
      - ./backend/contract-management-service:/app
      - maven_cache:/root/.m2
    command: >
      sh -c "chmod +x ./mvnw && ./mvnw --no-transfer-progress -T 1C -o -DskipTests clean spring-boot:run -Dspring-boot.run.jvmArguments='-Dserver.port=8000'"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docgo_network_local

  # AI Processing + Notification Service (FastAPI) - Port 8003
  ai-processing-service:
    image: python:3.11-slim
    container_name: docgo-local-ai-processing-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8003:8000"
    env_file:
      - backend/ai-processing-service/env/.env.local
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./backend/ai-processing-service:/app
      - ai_processing_results_local:/app/results
      - pip_cache:/root/.cache/pip
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docgo_network_local

  # File Storage Service (FastAPI) - Port 8004
  file-storage-service:
    image: python:3.11-slim
    container_name: docgo-local-file-storage-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8004:8000"
    env_file:
      - backend/file-storage-asset-service/env/.env.local
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./backend/file-storage-asset-service:/app
      - file_storage_uploads_local:/app/uploads
      - file_storage_temp_local:/app/temp
      - pip_cache:/root/.cache/pip
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docgo_network_local

  # MongoDB MCP Server - Port 8005
  mongodb-mcp-server:
    image: node:22-alpine
    container_name: docgo-local-mongodb-mcp-server
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8005:3000"
    environment:
      - MDB_MCP_CONNECTION_STRING=mongodb+srv://root:sapassword@devgo-docgo-cluster0.hsudzga.mongodb.net/?retryWrites=true&w=majority&appName=devgo-docgo-cluster0
      - MDB_MCP_READ_ONLY=false
      - MDB_MCP_TRANSPORT=stdio
      - MDB_MCP_LOGGERS=mcp,stderr
    volumes:
      - ./mcp-server:/app
      - npm_cache:/root/.npm
    command: >
      sh -c "npm install -g mongodb-mcp-server@latest && mongodb-mcp-server"
    networks:
      - docgo_network_local

volumes:
  # Data volumes
  redis_data_local:
    driver: local
  ai_processing_results_local:
    driver: local
  file_storage_uploads_local:
    driver: local
  file_storage_temp_local:
    driver: local
  
  # Cache volumes for faster builds
  maven_cache:
    driver: local
  npm_cache:
    driver: local
  pip_cache:
    driver: local

networks:
  docgo_network_local:
    driver: bridge
