# Docker Compose - Simplified Architecture (5 Services + Infrastructure)
# Tên container: docgo
# Kiến trúc tối giản: 5 services + MongoDB Atlas + Redis + Kafka

services:
  # Redis - Cache và Message Queue
  redis:
    image: redis:7-alpine
    container_name: docgo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docgo_network

  # Kafka - Message Broker (tùy chọn, có thể bỏ nếu không cần)
  kafka:
    image: bitnami/kafka:3.7
    container_name: docgo-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9094
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9094,INTERNAL://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_MESSAGE_MAX_BYTES=10485760  # 10MB
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=10485760  # 10MB
      - KAFKA_CFG_MAX_REQUEST_SIZE=10485760  # 10MB
    networks:
      - docgo_network

  # API Gateway BFF (Next.js) - Port 8000
  api-gateway-bff:
    image: node:18-alpine
    container_name: docgo-api-gateway-bff
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - backend/api-gateway-bff/env/.env
    environment:
      - NODE_ENV=development
      - AUTHENTICATION_SERVICE_URL=http://authentication-identity-service:8000
    volumes:
      - ./backend/api-gateway-bff:/app
      - /app/node_modules
      - npm_cache:/root/.npm
    command: >
      sh -c "npm install --cache /root/.npm && npm run dev"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docgo_network

  # Frontend Web (Next.js) - Development server on port 3000
  web-nextjs:
    image: node:18-alpine
    container_name: docgo-web-nextjs
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - frontend/web_nextjs/env/.env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      - NEXT_WEBPACK_USEPOLLING=1
      - BROWSER=none
      - FAST_REFRESH=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend/web_nextjs:/app
      - /app/node_modules
      - /app/.next
      - npm_cache:/root/.npm
    # CPU và Memory limits để tránh quá tải
    deploy:
      resources:
        limits:
          cpus: '2.0'      # Giới hạn tối đa 2 CPU cores
          memory: 2G       # Giới hạn tối đa 2GB RAM
        reservations:
          cpus: '0.5'      # Đảm bảo tối thiểu 0.5 CPU core
          memory: 512M     # Đảm bảo tối thiểu 512MB RAM
    # Alternative: Sử dụng cpus và mem_limit (cho Docker Compose v2)
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 512m
    command: >
      sh -c "npm install --cache /root/.npm && npm run dev -- -p 3000 -H 0.0.0.0"
    networks:
      - docgo_network

  # Authentication & Identity Service (Spring Boot) - Port 8002
  authentication-identity-service:
    build:
      context: backend/authentication-identity-service
      dockerfile: Dockerfile
      target: builder
    container_name: docgo-authentication-identity-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8002:8000"
    env_file:
      - backend/authentication-identity-service/env/.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_ATLAS_URI=mongodb+srv://root:sapassword@devgo-docgo-cluster0.hsudzga.mongodb.net/docgo_auth_service?retryWrites=true&w=majority&appName=devgo-docgo-cluster0
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
    volumes:
      - ./backend/authentication-identity-service:/app
      - maven_cache:/root/.m2
    # CPU và Memory limits cho Spring Boot service
    cpus: 1.5
    mem_limit: 1.5g
    mem_reservation: 512m
    command: >
      sh -c "chmod +x ./mvnw && ./mvnw -DskipTests clean spring-boot:run -Dspring-boot.run.jvmArguments='-Dserver.port=8000 -Dspring.devtools.restart.enabled=true'"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docgo_network

  # Contract Management Service (Spring Boot) - Port 8003
  contract-management-service:
    build:
      context: backend/contract-management-service
      dockerfile: Dockerfile
      target: builder
    container_name: docgo-contract-management-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8003:8000"
    env_file:
      - backend/contract-management-service/env/.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MAVEN_OPTS=-Xmx2g -XX:+UseG1GC -XX:+UseStringDeduplication
      - MONGODB_ATLAS_URI=mongodb://root:password@mongodb:27017/docgo_contract_service?authSource=admin
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
    volumes:
      - ./backend/contract-management-service:/app
      - maven_cache:/root/.m2
    # CPU và Memory limits cho Contract Management Service
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 1g
    command: >
      sh -c "chmod +x ./mvnw && ./mvnw --no-transfer-progress -T 2C -o -DskipTests clean spring-boot:run -Dspring-boot.run.jvmArguments='-Dserver.port=8000 -Dspring.devtools.restart.enabled=true -Dmaven.compiler.fork=true'"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docgo_network

  # AI Processing + Notification Service (FastAPI) - Port 8004
  ai-processing-service:
    image: python:3.11-slim
    container_name: docgo-ai-processing-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8004:8000"
    env_file:
      - backend/ai-processing-service/env/.env
    environment:
      - ENVIRONMENT=development
      - MONGODB_ATLAS_URI=mongodb+srv://root:sapassword@devgo-docgo-cluster0.hsudzga.mongodb.net/docgo_ai_service?retryWrites=true&w=majority&appName=devgo-docgo-cluster0
    volumes:
      - ./backend/ai-processing-service:/app
      - ai_processing_results:/app/results
      - pip_cache:/root/.cache/pip
    # CPU và Memory limits cho AI Processing Service (có thể CPU intensive)
    cpus: 3.0
    mem_limit: 3g
    mem_reservation: 1g
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docgo_network

  # File Storage Service (FastAPI) - Port 8005
  file-storage-service:
    image: python:3.11-slim
    container_name: docgo-file-storage-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8005:8000"
    env_file:
      - backend/file-storage-asset-service/env/.env
    environment:
      - ENVIRONMENT=development
      - MONGODB_ATLAS_URI=mongodb+srv://root:sapassword@devgo-docgo-cluster0.hsudzga.mongodb.net/docgo_file_service?retryWrites=true&w=majority&appName=devgo-docgo-cluster0
    volumes:
      - ./backend/file-storage-asset-service:/app
      - file_storage_uploads:/app/uploads
      - file_storage_temp:/app/temp
      - pip_cache:/root/.cache/pip
    # CPU và Memory limits cho File Storage Service
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docgo_network




volumes:
  # Data volumes
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  ai_processing_results:
    driver: local
  file_storage_uploads:
    driver: local
  file_storage_temp:
    driver: local
  
  # Cache volumes for faster builds
  maven_cache:
    driver: local
  npm_cache:
    driver: local
  pip_cache:
    driver: local

networks:
  docgo_network:
    driver: bridge
