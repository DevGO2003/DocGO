version: '3.8'

services:
  # ==========================================
  # INFRASTRUCTURE SERVICES
  # ==========================================

  # Kafka Broker
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.4.0
    
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka-data:/tmp/kafka-logs
    networks:
      - docgo-network
    restart: unless-stopped

  # Zookeeper (Alternative to KRaft mode)
  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.4.0
    
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - docgo-network
    restart: unless-stopped

  # Kafka UI (Optional - for monitoring)
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - docgo-network
    restart: unless-stopped

  # Redis (Cache and session storage)
  redis:
    container_name: redis
    image: redis:7-alpine
    
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - docgo-network
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ==========================================
  # MICROSERVICES
  # ==========================================

  # User Management Service (Spring Boot)
  user-management-service:
    container_name: user-management-service
    build:
      context: ./backend/user-management-service
      dockerfile: Dockerfile
    
    ports:
      - "${USER_MANAGEMENT_PORT:-8001}:8000"
    env_file:
      - .env
      - ./backend/user-management-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8000
      - MONGODB_DATABASE=${MONGODB_USER_DATABASE}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID_PREFIX}-user-management
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID_PREFIX}-user-management
    depends_on:
      - kafka
      - redis
    networks:
      - docgo-network
    volumes:
      - ./logs/user-management:/app/logs
    restart: unless-stopped

  # Document Management Service (Spring Boot)
  document-management-service:
    container_name: document-management-service
    build:
      context: ./backend/document-management-service
      dockerfile: Dockerfile
    
    ports:
      - "${DOCUMENT_MANAGEMENT_PORT:-8002}:8000"
    env_file:
      - .env
      - ./backend/document-management-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8000
      - MONGODB_DATABASE=${MONGODB_DOCUMENT_DATABASE}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID_PREFIX}-document-management
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID_PREFIX}-document-management
    depends_on:
      - kafka
      - redis
    networks:
      - docgo-network
    volumes:
      - ./backend/document-management-service/uploads:/app/uploads
      - ./logs/document-management:/app/logs
    restart: unless-stopped

  # Automation Service (FastAPI)
  automation-service:
    container_name: automation-service
    build:
      context: ./backend/automation-service
      dockerfile: Dockerfile
    
    ports:
      - "${AUTOMATION_PORT:-8003}:8000"
    env_file:
      - .env
      - ./backend/automation-service/.env
    environment:
      - ENVIRONMENT=docker
      - PORT=8000
      - MONGODB_DATABASE=${MONGODB_AUTOMATION_DATABASE}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID_PREFIX}-automation
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID_PREFIX}-automation
    depends_on:
      - kafka
      - redis
    networks:
      - docgo-network
    volumes:
      - ./backend/automation-service:/app
      - ./backend/automation-service/uploads:/app/uploads
      - ./backend/automation-service/results:/app/results
      - ./logs/automation:/app/logs
    restart: unless-stopped

  # API Gateway (Next.js)
  api-gateway:
    container_name: api-gateway
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    env_file:
      - .env
      - ./backend/api-gateway/.env
    environment:
      - PORT=8000
      - NODE_ENV=development
    depends_on:
      - kafka
      - redis
      - user-management-service
      - document-management-service
      - automation-service
    networks:
      - docgo-network
    volumes:
      - ./backend/api-gateway:/app
      - ./logs/api-gateway:/app/logs
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  # ==========================================
  # FRONTEND
  # ==========================================

  # Web App Frontend (Next.js)
  web-app:
    container_name: web-app
    build:
      context: ./frontend/web-app
      dockerfile: Dockerfile
    
    ports:
      - "${WEB_APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:${API_GATEWAY_PORT:-8000}
      - NEXT_PUBLIC_USER_SERVICE_URL=http://localhost:${USER_MANAGEMENT_PORT:-8001}
      - NEXT_PUBLIC_DOCUMENT_SERVICE_URL=http://localhost:${DOCUMENT_MANAGEMENT_PORT:-8002}
      - NEXT_PUBLIC_AUTOMATION_SERVICE_URL=http://localhost:${AUTOMATION_PORT:-8003}
    depends_on:
      - api-gateway
    networks:
      - docgo-network
    volumes:
      - ./logs/web-app:/app/logs
    restart: unless-stopped

# ==========================================
# VOLUMES
# ==========================================
volumes:
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  redis-data:
    driver: local

# ==========================================
# NETWORKS
# ==========================================
networks:
  docgo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16



